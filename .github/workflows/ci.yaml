
name: CI - Build and Scan Application

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./app
          push: false
          load: true
          tags: production-devops-app:${{ github.sha }}
          build-args: |
            RELEASE_SHA=${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: production-devops-app:${{ github.sha }}
          scan-type: image
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Save scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save production-devops-app:${GITHUB_SHA} | gzip > image.tar.gz

      - name: Upload scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scanned-image-${{ github.sha }}
          path: image.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Push Scanned Image to Amazon ECR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

    steps:
      - name: Download scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: scanned-image-${{ github.sha }}
          path: image-artifact

      - name: Load scanned image
        run: |
          gzip -dc image-artifact/image.tar.gz | docker load

      - name: Inspect GitHub OIDC context
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ENVIRONMENT: ${{ job.environment }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Job environment: $GITHUB_ENVIRONMENT"

      - name: Verify GitHub OIDC token issuance
        uses: actions/github-script@v7
        with:
          script: |
            const tokenUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const token = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;

            if (!tokenUrl || !token) {
              core.setFailed("GitHub OIDC token request variables are missing.");
              return;
            }

            const response = await fetch(
              `${tokenUrl}&audience=sts.amazonaws.com`,
              {
                headers: {
                  Authorization: `Bearer ${token}`
                }
              }
            );

            if (!response.ok) {
              core.setFailed(`OIDC token request failed with HTTP ${response.status}.`);
              return;
            }

            core.info("GitHub OIDC token issued successfully.");

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - name: Tag scanned image for ECR
        run: |
          ECR_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "production-devops-app:${GITHUB_SHA}" "$ECR_IMAGE"
          echo "ECR_IMAGE=$ECR_IMAGE" >> "$GITHUB_ENV"

      - name: Push scanned image to ECR
        run: |
          docker push "$ECR_IMAGE"
