name: Bootstrap EC2 Hosts

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-host-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Install host prerequisites through SSM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Install Docker, AWS CLI, and curl on both hosts
        shell: bash
        env:
          BLUE_INSTANCE_ID: ${{ vars.BLUE_INSTANCE_ID }}
          GREEN_INSTANCE_ID: ${{ vars.GREEN_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -Eeuo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$BLUE_INSTANCE_ID" "$GREEN_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters 'commands=["set -e","export DEBIAN_FRONTEND=noninteractive","apt-get update","apt-get install -y docker.io awscli curl","systemctl enable --now docker","docker --version","aws --version","curl --version | head -n 1","systemctl is-active docker"]' \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command: $COMMAND_ID"

          for INSTANCE_ID in "$BLUE_INSTANCE_ID" "$GREEN_INSTANCE_ID"; do
            echo "Waiting for bootstrap on $INSTANCE_ID"
            STATUS="Pending"
            for ATTEMPT in $(seq 1 120); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query 'Status' --output text 2>/dev/null || true)
              case "$STATUS" in
                Success) break ;;
                Failed|TimedOut|Cancelled)
                  aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --output json || true
                  echo "Bootstrap failed on $INSTANCE_ID ($STATUS)" >&2
                  exit 1
                  ;;
              esac
              sleep 5
            done
            if [[ "$STATUS" != "Success" ]]; then
              echo "Timed out waiting for $INSTANCE_ID; last status: $STATUS" >&2
              exit 1
            fi
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
              --output json
          done
