services:

  blue:
    build: .
    container_name: blue
    expose:
      - "8080"

  green:
    build: .
    container_name: green
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - blue
      - green
