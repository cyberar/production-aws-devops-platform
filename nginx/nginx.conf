worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # --------------------------------------------------
    # BLUE ENVIRONMENT
    # --------------------------------------------------
    upstream blue_app {
        server blue:8080 max_fails=3 fail_timeout=10s;
    }

    # --------------------------------------------------
    # GREEN ENVIRONMENT
    # --------------------------------------------------
    upstream green_app {
        server green:8080 max_fails=3 fail_timeout=10s;
    }

    # --------------------------------------------------
    # ACTIVE ENVIRONMENT
    #
    # blue  -> Blue is primary
    # green -> Green is primary
    #
    # --------------------------------------------------
    upstream active_app {
        server blue:80 max_fails=3 fail_timeout=10s;
        server green:80 backup;
    }

    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # --------------------------------------------------
        # NGINX HEALTH CHECK
        # --------------------------------------------------
        location /health {
            access_log off;

            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # --------------------------------------------------
        # APPLICATION
        # --------------------------------------------------
        location / {
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://active_app;
        }
    }
}
